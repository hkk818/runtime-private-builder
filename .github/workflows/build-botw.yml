name: Build Zelda Breath of the Wild IPA

on:

  workflow_dispatch:

    inputs:

      release_tag:

        description: 'Release Tag'

        required: true

        default: 'v1.1'



permissions:

  contents: write



jobs:

  build-ipa:

    runs-on: macos-15

    timeout-minutes: 180

    env:

      GAME: "01007EF00011E000"

      DM_GAME: "01007EF00011E000"

      PKG_VER: "v1114112"

      MODS_LIST: "main subsdk0 sdk"

      ROMFS_MARKER: "Pack/Bootup_Graphics.pack"

      OUT_IPA_NAME: "ZeldaBreathOfTheWild-shell.ipa"

      ZIP_NAME: "exefs_ready_01007EF00011E000.zip"

      WORK_DIR: "${{ github.workspace }}/game_work"

      DM_ROOT: "${{ github.workspace }}/game_work"

      WORK: "${{ github.workspace }}/game_work/tmp"

      EXEFS_SRC: "${{ github.workspace }}/extracted_bundle/exefs"

      CTRL_SRC: "${{ github.workspace }}/extracted_bundle/control"

      MINI_ROMFS: "${{ github.workspace }}/extracted_bundle/mini_romfs"

    steps:

      - name: 1. 

        run: |

          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)

          sudo xcode-select -s "$LATEST_XCODE"

          xcodebuild -version

          xcrun -sdk iphoneos metal -v 2>/dev/null || xcodebuild -downloadComponent MetalToolchain || true

          brew install xcodegen zstd spirv-cross

          brew install --cask dotnet-sdk || true

          python3 -m pip install --break-system-packages lz4 capstone fonttools || python3 -m pip install lz4 capstone fonttools



      - name: 2.  nxnative TLS + A15 + Documents

        run: |

          git clone https://github.com/seedds/nxnative.git nxnative
          (cd nxnative && git checkout b1c7426052)

          cd nxnative



          #   A:   Nintendo SDK 8.2.0   (  sdk build ID: 3ae34e689d7a35f13cbf42bfd672af8b)

          #   nnMain   StandardAllocator   AllocateTlsSlot  

          if [ "$GAME" = "01006BB00C6F0000" ]; then

            python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

          fi



          #   B:   project.yml  -mcpu=apple-a18   A15 (iPhone 13)   A18 (16 Pro)  

          python3 -c '

          p = "dm/ios/project.yml"

          s = open(p, "r", encoding="utf-8").read()

          s = s.replace("-mcpu=apple-a18", "-march=armv8.5-a")

          open(p, "w", encoding="utf-8").write(s)

          print("  [OK]  armv8.5-a iPhone 13  16 Pro")

          '



          #   C: 修复 hle_fs.c 自动检测 Documents/romfs (大小写全兼容: romfs / RomFS / ROMFS)

          python3 -c '

          p = "dm/host/hle_fs.c"

          s = open(p, "r", encoding="utf-8").read()

          old = "const char *v = getenv(var);\n    if (v) return v;"

          new = """if (!strcmp(var, "DM_ROMFS")) {

              const char *h = getenv("HOME");

              if (h) {

                  snprintf(buf, n, "%s/Documents/romfs/" DM_GAME_ROMFS_MARKER, h);

                  if (!access(buf, F_OK)) { snprintf(buf, n, "%s/Documents/romfs", h); return buf; }

                  snprintf(buf, n, "%s/Documents/RomFS/" DM_GAME_ROMFS_MARKER, h);

                  if (!access(buf, F_OK)) { snprintf(buf, n, "%s/Documents/RomFS", h); return buf; }

                  snprintf(buf, n, "%s/Documents/ROMFS/" DM_GAME_ROMFS_MARKER, h);

                  if (!access(buf, F_OK)) { snprintf(buf, n, "%s/Documents/ROMFS", h); return buf; }

                  snprintf(buf, n, "%s/Documents/" DM_GAME_ROMFS_MARKER, h);

                  if (!access(buf, F_OK)) { snprintf(buf, n, "%s/Documents", h); return buf; }

              }

          }

          const char *v = getenv(var);

          if (v) return v;"""

          assert old in s

          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))

          print("  [OK] Documents/romfs 大小写全兼容支持注入成功")

          '



          #   D:   main.c   Documents/aoc   DLC

          python3 -c '

          p = "dm/host/main.c"

          s = open(p, "r", encoding="utf-8").read()

          old = "g_t0_ns = proc_start_mono_ns();"

          new = """g_t0_ns = proc_start_mono_ns();

          if (getenv("HOME")) {

              char aoc_buf[1024];

              snprintf(aoc_buf, sizeof aoc_buf, "%s/Documents/aoc", getenv("HOME"));

              if (!access(aoc_buf, F_OK)) setenv("DM_AOC_DIR", aoc_buf, 1);

          }"""

          assert old in s

          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))

          print("  [OK] Documents/aoc DLC ")

          '



          #   E: A15   BC (DXT)   (  131 pixelFormat  )

          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"





          # Overlay upgraded BotW native enhancements
          if [ -d "${{ github.workspace }}/patches_botw" ]; then
            echo "==> Overlaying upgraded patches_botw files..."
            cp -rf "${{ github.workspace }}/patches_botw/"* .
            echo "  [OK] patches_botw overlaid successfully"
          fi

      - name: 3. 

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}

        run: |

          mkdir -p ~/.switch raw_dl extracted_bundle "$WORK_DIR/tmp" "$WORK_DIR/patched_$PKG_VER" "$WORK_DIR/shader/pkg" "$WORK_DIR/shader/tables" "$WORK_DIR/shader/cache" "$WORK_DIR/shader/ios" "$WORK_DIR/data/$PKG_VER/RomFS" "$WORK_DIR/data/v0" "${{ github.workspace }}/final_output"

          if [ -n "$KEYS_B64" ]; then

            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys

          fi

          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "$ZIP_NAME" --clobber

          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "pso_manifest*.tsv" --clobber || true

          if [ -f "raw_dl/pso_manifest_$GAME.tsv" ]; then

            cp -f "raw_dl/pso_manifest_$GAME.tsv" "nxnative/dm/games/$GAME/pso_manifest.tsv"

            echo "  [OK] Copied raw_dl/pso_manifest_$GAME.tsv to nxnative/dm/games/$GAME/pso_manifest.tsv"

          fi

          python3 -c '

          import zipfile, os

          zpath = os.path.join("raw_dl", os.environ["ZIP_NAME"])

          with zipfile.ZipFile(zpath, "r") as z:

              for info in z.infolist():

                  fname = info.filename.replace("\\", "/")

                  if not fname.endswith("/"):

                      target = os.path.join("extracted_bundle", fname)

                      os.makedirs(os.path.dirname(target), exist_ok=True)

                      with open(target, "wb") as out:

                          out.write(z.read(info.filename))

          '



      - name: 4.  NSO  (patch_nso.py CUT)

        run: |

          cd "${{ github.workspace }}/nxnative"

          for mod in $MODS_LIST; do

            DM_RULESET=native python3 dm/tools/patch_nso.py "$EXEFS_SRC/$mod" "$WORK_DIR/patched_$PKG_VER" "$mod"

          done



      - name: 5.  ( 25,000+ )

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          cd "${{ github.workspace }}/nxnative"

          NEED_FULL_BUILD=1

          echo "==> 检查历史构建中是否有匹配当前游戏的 Metal 着色器缓存..."

          python3 -c '

          import zipfile, os, sys, subprocess

          repo = os.environ.get("GITHUB_REPOSITORY", "")

          ipa_name = os.environ["OUT_IPA_NAME"]

          work = os.environ["WORK_DIR"]

          game = os.environ["GAME"]



          cmd = ["gh", "run", "list", "--repo", repo, "--workflow=build-botw.yml", "-s", "success", "--json", "databaseId", "-q", ".[].databaseId", "--limit", "30"]
          res = subprocess.run(cmd, capture_output=True, text=True)
          run_ids = ["40553515790"] + [line.strip() for line in res.stdout.strip().splitlines() if line.strip()]
          seen = set(); run_ids = [x for x in run_ids if not (x in seen or seen.add(x))]

          found = False
          for rid in run_ids:
              prev_dir = f"prev_art_{rid}"
              os.makedirs(prev_dir, exist_ok=True)
              subprocess.run(["gh", "run", "download", rid, "--repo", repo, "-n", "nxnative-output-ipa", "--dir", prev_dir], capture_output=True)
              ipa_path = os.path.join(prev_dir, ipa_name)
              if os.path.exists(ipa_path):
                  print(f"==> 命中匹配当前游戏 ({ipa_name}) 的历史构建: Run ID {rid}")
                  with zipfile.ZipFile(ipa_path, "r") as z:
                      for info in z.infolist():
                          name = info.filename
                          if "Payload/DmIOS.app/msl/" in name:
                              rel = name.split("Payload/DmIOS.app/msl/")[1]
                              if rel and not name.endswith("/"):
                                  target = os.path.join(work, "shader", "ios", rel)
                                  os.makedirs(os.path.dirname(target), exist_ok=True)
                                  with open(target, "wb") as f: f.write(z.read(name))
                          elif name == "Payload/DmIOS.app/dm/c1_full.tsv":
                              target = os.path.join("dm/games", game, "c1_full.tsv")
                              with open(target, "wb") as f: f.write(z.read(name))
                          elif name == "Payload/DmIOS.app/dm/cb_extent.tsv":
                              target = os.path.join("dm/games", game, "cb_extent.tsv")
                              with open(target, "wb") as f: f.write(z.read(name))
                          elif name == "Payload/DmIOS.app/dm/pso_manifest.tsv":
                              target = os.path.join("dm/games", game, "pso_manifest.tsv")
                              if not os.path.exists(target) or os.path.getsize(target) < 1000:
                                  with open(target, "wb") as f: f.write(z.read(name))
                          elif name == "Payload/DmIOS.app/dm/shader_map.tsv":
                              target = os.path.join("dm/games", game, "shader_map.tsv")
                              with open(target, "wb") as f: f.write(z.read(name))
                          elif name == "Payload/DmIOS.app/dm/shader_pairs.tsv":
                              target = os.path.join("dm/games", game, "shader_pairs.tsv")
                              with open(target, "wb") as f: f.write(z.read(name))
                  found = True
                  break

          if not found:

              print(f"历史产物非当前游戏 ({ipa_name})，需全量编译当前游戏着色器")

              sys.exit(1)

          print("  [OK] 历史 Metal 着色器复用成功")

          ' && NEED_FULL_BUILD=0 || NEED_FULL_BUILD=1

            if [ -f "dm/games/$GAME/c1_full.tsv" ] && [ -d "$WORK_DIR/shader/ios" ]; then

              python3 -c '

              import os, glob, subprocess

              work = os.environ["WORK_DIR"]

              game = os.environ["GAME"]

              dirs = glob.glob(os.path.join(work, "shader", "ios", "b-*"))

              if dirs:

                  ver = os.path.basename(dirs[0]).replace("b-", "")

                  print(f"==> DMSH_CHAIN version: {ver}")

                  with open("dm/gfx/nvn/dmsh_chain.h", "w", encoding="utf-8") as f:

                      f.write("#define DMSH_CHAIN " + chr(34) + ver + chr(34) + "\n")

                  cmd = ["python3", "dm/gfx/tools/dmsh_chain.py", "--inputs"]

                  res = subprocess.run(cmd, env=dict(os.environ, DM_GAME=game), capture_output=True, text=True)

                  in_hash = res.stdout.strip()

                  tsv_path = os.path.join(dirs[0], "inputs.tsv")

                  if in_hash:

                      with open(tsv_path, "w", encoding="utf-8") as f:

                          f.write("game\t" + game + "\ninputs\t" + in_hash + "\n")

                      print(f"  [OK] inputs.tsv stamped with {in_hash}")

              '

            fi



          # 如果成功复用了历史着色器，但存在未翻译的新着色器（如 No-DoF 移轴去虚化 0d43a97756128f26）

          if [ -d "$WORK_DIR/shader/ios" ]; then

            python3 -c '

            import os, glob, subprocess

            work = os.environ["WORK_DIR"]

            game = os.environ["GAME"]

            metallibs = glob.glob(os.path.join(work, "shader", "ios", "**", "0d43a97756128f26_b.metallib"), recursive=True)

            if not metallibs and game == "01006BB00C6F0000":

                print("==> 检测到 No-DoF 去虚化着色器未编译，正在执行针对性快速增量编译 (0d43a97756128f26)...")

                cmd1 = ["python3", "dm/gfx/tools/shader_split.py", os.environ["MINI_ROMFS"], os.path.join(os.environ["EXEFS_SRC"], "main"),

                        os.path.join(work, "shader", "pkg"), os.path.join(work, "shader", "tables", "shader_map.tsv"),

                        os.path.join(work, "shader", "tables", "shader_facts.tsv"), os.path.join(work, "shader", "tables", "shader_pairs.tsv")]

                subprocess.run(cmd1, check=True)

                import shutil

                shutil.copyfile(os.path.join(work, "shader", "tables", "shader_map.tsv"), os.path.join("dm/games", game, "shader_map.tsv"))

                shutil.copyfile(os.path.join(work, "shader", "tables", "shader_pairs.tsv"), os.path.join("dm/games", game, "shader_pairs.tsv"))

                env = dict(os.environ, MAIN=os.path.join(os.environ["EXEFS_SRC"], "main"),

                           XLATE=os.path.join(os.getcwd(), "dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate"),

                           IOSOUT=os.path.join(work, "shader", "ios"), J="8")

                subprocess.run(["chmod", "+x", env["XLATE"]], check=True)

                subprocess.run(["python3", "dm/gfx/tools/dmsh_chain.py", "--update-lock"], check=True)

                subprocess.run(["python3", "dm/gfx/tools/dmsh_chain.py", "--header"], check=True)

                cmd2 = ["python3", "dm/gfx/tools/dmsh_build.py", os.path.join(work, "shader", "pkg"), os.path.join(work, "shader", "cache"), "0d43a97756128f26"]

                subprocess.run(cmd2, env=env, check=True)

                dirs = glob.glob(os.path.join(work, "shader", "ios", "b-*"))

                if dirs:

                    main_dir = max(dirs, key=lambda d: len(os.listdir(d)))

                    main_ver = os.path.basename(main_dir).replace("b-", "")

                    found = glob.glob(os.path.join(work, "shader", "ios", "**", "0d43a97756128f26_b.metallib"), recursive=True)

                    if found and os.path.abspath(found[0]) != os.path.abspath(os.path.join(main_dir, "0d43a97756128f26_b.metallib")):

                        shutil.copyfile(found[0], os.path.join(main_dir, "0d43a97756128f26_b.metallib"))

                        js = found[0].replace(".metallib", ".json")

                        if os.path.exists(js):

                            import json

                            with open(js, "r", encoding="utf-8") as jf:

                                jd = json.load(jf)

                            jd["chain"] = main_ver

                            with open(os.path.join(main_dir, "0d43a97756128f26_b.json"), "w", encoding="utf-8") as jf:

                                json.dump(jd, jf, indent=1)

                    for d in dirs:

                        if os.path.abspath(d) != os.path.abspath(main_dir):

                            shutil.rmtree(d, ignore_errors=True)

                    with open("dm/gfx/nvn/dmsh_chain.h", "w", encoding="utf-8") as f:

                        f.write("#define DMSH_CHAIN " + chr(34) + main_ver + chr(34) + "\n")

                    print(f"  [OK] No-DoF 0d43a97756128f26_b.metallib consolidated into {main_dir} (DMSH_CHAIN {main_ver})")'

          fi



          # 确保 Zelda 织梦岛双通道着色器齐备

          if [ "$GAME" = "01006BB00C6F0000" ] && [ -d "$WORK_DIR/shader/ios" ]; then

            python3 -c '

            import os, glob, shutil

            work = os.environ["WORK_DIR"]

            game = os.environ["GAME"]

            dirs = glob.glob(os.path.join(work, "shader", "ios", "b-*"))

            if dirs:

                main_dir = max(dirs, key=lambda d: len(os.listdir(d)))

                nodof_mtl = os.path.join(main_dir, "0d43a97756128f26_b.metallib")

                nodof_js = os.path.join(main_dir, "0d43a97756128f26_b.json")

                if os.path.exists(nodof_mtl):

                    shutil.copyfile(nodof_mtl, os.path.join(main_dir, "52fcbb4ca2a78907_b.metallib"))

                if os.path.exists(nodof_js):

                    with open(nodof_js, "r", encoding="utf-8") as jf:

                        jdata = jf.read().replace("0d43a97756128f26_b", "52fcbb4ca2a78907_b")

                    with open(os.path.join(main_dir, "52fcbb4ca2a78907_b.json"), "w", encoding="utf-8") as jf:

                        jf.write(jdata)

                shmap_p = os.path.join("dm/games", game, "shader_map.tsv")

                if os.path.exists(shmap_p):

                    with open(shmap_p, "r", encoding="utf-8") as f: s = f.read()

                    ln_orig = "ps_shader.bin\t4226\tpixel\t52fcbb4ca2a78907\t/region_common/shader/postprocess.bfsha#BNSH@0x2a6000#var0"

                    ln_mod  = "ps_shader.bin\t4226\tpixel\t0d43a97756128f26\t/region_common/shader/postprocess.bfsha#BNSH@0x2a6000#var0"

                    if "52fcbb4ca2a78907" not in s: s += "\n" + ln_orig

                    if "0d43a97756128f26" not in s: s += "\n" + ln_mod

                    with open(shmap_p, "w", encoding="utf-8") as f: f.write(s)

                print("  [OK] Guaranteed dual-channel No-DoF shaders in Zelda bundle")

            '

          fi



          if [ "$NEED_FULL_BUILD" -eq 1 ]; then

            echo "==> 正在完整编译游戏 Metal 着色器..."

            python3 dm/gfx/tools/shader_split.py "$MINI_ROMFS" "$EXEFS_SRC/main" "$WORK_DIR/shader/pkg" "$WORK_DIR/shader/tables/shader_map.tsv" "$WORK_DIR/shader/tables/shader_facts.tsv" "$WORK_DIR/shader/tables/shader_pairs.tsv"



            cp -f "$WORK_DIR/shader/tables/shader_map.tsv" "dm/games/$GAME/shader_map.tsv"

            cp -f "$WORK_DIR/shader/tables/shader_pairs.tsv" "dm/games/$GAME/shader_pairs.tsv"



            chmod +x dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate

            python3 dm/gfx/tools/dmsh_chain.py --update-lock || true
            python3 dm/gfx/tools/dmsh_chain.py --header || true

            MAIN="$EXEFS_SRC/main" XLATE="$PWD/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate" IOSOUT="$WORK_DIR/shader/ios" J=8 python3 dm/gfx/tools/dmsh_build.py "$WORK_DIR/shader/pkg" "$WORK_DIR/shader/cache" || true

          fi



      - name: 6.  Xcode  IPA

        run: |

          cd "${{ github.workspace }}/nxnative"

          export USER=$(whoami)

          MARKER_PATH="$WORK_DIR/data/$PKG_VER/RomFS/$ROMFS_MARKER"

          mkdir -p "$(dirname "$MARKER_PATH")"

          touch "$MARKER_PATH"



          cp -f "$EXEFS_SRC/control.nacp" "$WORK_DIR/data/v0/control.nacp"

          cp -f "$EXEFS_SRC/control.nacp" "$WORK_DIR/data/$PKG_VER/control.nacp"



          ICON_FILE=""

          if [ -f "$CTRL_SRC/icon_SimplifiedChinese.dat" ]; then

            cp -f "$CTRL_SRC/icon_SimplifiedChinese.dat" "$WORK_DIR/data/$PKG_VER/icon.jpg"

            ICON_FILE="$WORK_DIR/data/$PKG_VER/icon.jpg"

          elif [ -f "$CTRL_SRC/icon_AmericanEnglish.dat" ]; then

            cp -f "$CTRL_SRC/icon_AmericanEnglish.dat" "$WORK_DIR/data/$PKG_VER/icon.jpg"

            ICON_FILE="$WORK_DIR/data/$PKG_VER/icon.jpg"

          fi



          OUT_IPA="${{ github.workspace }}/final_output/$OUT_IPA_NAME"

          chmod +x dm/ios/tools/build_ipa.sh



          export GAME="$GAME"
          export W="$WORK_DIR"
          export PATCHED="$WORK_DIR/patched_$PKG_VER"
          export ROMFS="$WORK_DIR/data/$PKG_VER/RomFS"
          export MSL_IOS="$WORK_DIR/shader/ios"
          export DM_ICON="$ICON_FILE"
          export DM_STANDALONE_MSL="YES"
          export AOC=""
          export DM_PSO_GPUS="none"
          V=$(sed -n 's/^#define DMSH_CHAIN "\(.*\)"/\1/p' dm/gfx/nvn/dmsh_chain.h)
          [ -z "$V" ] && V="670578cbb17a"
          mkdir -p "$MSL_IOS/b-$V" "$MSL_IOS/b-670578cbb17a"
          touch "$MSL_IOS/b-$V/inputs.tsv" "$MSL_IOS/b-670578cbb17a/inputs.tsv"
          touch "$MSL_IOS/b-$V/standalone_b.metallib" "$MSL_IOS/b-670578cbb17a/standalone_b.metallib"
          bash dm/ios/tools/build_ipa.sh "$OUT_IPA"



          ls -lh "${{ github.workspace }}/final_output"



      - name: 7.  IPA 

        uses: actions/upload-artifact@v4

        with:

          name: nxnative-output-ipa

          path: ${{ github.workspace }}/final_output/*.ipa

          if-no-files-found: error

          retention-days: 7